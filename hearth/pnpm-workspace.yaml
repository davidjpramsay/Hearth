packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp

# Prefer same-major security patches; minimatch's only upstream fix is 11.0.1.
# Its tracked patch retains the older lint tools' callable/default import surface.
overrides:
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'fast-uri@>=4.0.0 <4.2.3': 4.2.3
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'minimatch@<11.0.1': 11.0.1
  'nanoid@<3.3.18': 3.3.18
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
patchedDependencies:
  minimatch@11.0.1: patches/minimatch@11.0.1.patch
